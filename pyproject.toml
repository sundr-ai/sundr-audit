[project]
name = "sundr"
version = "0.1.0"
description = "Savings Audit: how many of your LLM judgment calls a cheap decision model can answer, at a certified error"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sundr", email = "hello@sundr.ai" }]
keywords = ["llm", "classification", "llm-as-judge", "conformal", "certification", "mcp", "cost"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "pyarrow>=16",
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "jinja2>=3.1",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "pyyaml>=6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "mcp>=1.0"]

[project.urls]
Homepage = "https://sundr.ai"
Repository = "https://github.com/sundr-ai/sundr-audit"
Documentation = "https://sundr.ai/docs"

[project.scripts]
sundr = "sundr.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sundr*"]

[tool.setuptools.package-data]
"sundr" = ["setup.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
